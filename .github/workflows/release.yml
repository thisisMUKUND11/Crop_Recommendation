name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crop_recommendation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvest-iq-release-apk
          path: crop_recommendation/build/app/outputs/flutter-apk/app-release.apk
