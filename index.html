<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Crop Recommendation System</h1>
        <div class="input-group">
            <label for="district">Enter District:</label>
            <input type="text" id="district" placeholder="e.g., Salem">
        </div>
        <div class="input-group">
            <label for="language">Select Language:</label>
            <select id="language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="kn">Kannada</option>
                <option value="ml">Malayalam</option>
                <option value="bn">Bengali</option>
                <option value="mr">Marathi</option>
                <option value="gu">Gujarati</option>
                <option value="pa">Punjabi</option>
            </select>
        </div>
        <button id="get-recommendation">Get Recommendation</button>
        <div id="result" class="result-container" style="display: none;">
            <h2>Recommended Crops:</h2>
            <p id="recommendation"></p>
        </div>
    </div>
    <!-- config.js is gitignored; copy config.example.js to config.js and add your keys -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
